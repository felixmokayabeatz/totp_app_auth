server {
    listen 80;
    server_name apps.felixmokayabeatz.online www.apps.felixmokayabeatz.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name apps.felixmokayabeatz.online www.apps.felixmokayabeatz.online;

    client_max_body_size 500M;

    ssl_certificate /etc/letsencrypt/live/apps.felixmokayabeatz.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps.felixmokayabeatz.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /staticfiles/ {
        alias /home/felixmokayabeatz/beatzlock_project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Django counts the download and authorizes it, then nginx sends the
    # binary from here so no Gunicorn worker streams the payload.
    location /internal-media/ {
        internal;
        alias /home/felixmokayabeatz/beatzlock_project/media/;
        sendfile on;
        tcp_nopush on;
        add_header Accept-Ranges bytes always;
    }

    # App binaries still route through Django so download counts stay accurate.
    location /media/ {
        proxy_pass http://127.0.0.1:8012;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
