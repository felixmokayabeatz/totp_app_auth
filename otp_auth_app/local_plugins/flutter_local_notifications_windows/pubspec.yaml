name: flutter_local_notifications_windows
description: Local no-op Windows implementation for flutter_local_notifications.
version: 2.0.1
homepage: https://github.com/MaikuB/flutter_local_notifications

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^10.0.0
  timezone: ^0.10.0

flutter:
  plugin:
    implements: flutter_local_notifications
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindows
