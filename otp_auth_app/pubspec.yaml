name: beatzlock_auth
description: BeatzLock Authenticator - Secure Two-Factor Authentication
version: 1.8.0+45

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  provider: ^6.1.1
  crypto: ^3.0.3
  device_info_plus: ^13.1.0
  mobile_scanner: ^7.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  qr: ^4.0.0
  totp: ^0.1.0
  image_picker: ^1.2.2
  path_provider: ^2.1.2
  http_parser: ^4.0.2
  file_selector_windows: ^0.9.3+5
  local_auth: ^3.0.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.1
  workmanager: ^0.10.9
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.12.0
  firebase_messaging: ^16.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # The only override left, and the only one that earns its place: the copy in
  # local_plugins/ is not stock. Its Windows implementation was stripped back to
  # a stub (see the "Refactor Windows notification plugin" commit), so taking
  # the published package instead would undo that.
  #
  # firebase_core used to be overridden here too, at 4.9.0. That copy was stock
  # apart from edits to its bundled example app, and pinning it is what broke
  # the Windows build: firebase_messaging 16.4 needs firebase_core ^4.12, an
  # override silences the version solver, and the mismatch surfaced as
  # "Type 'FirebasePlugin' not found" from inside the pub cache instead of as a
  # resolution error. It now comes from pub like everything else.
  #
  # The exact pins that used to sit here -- code_assets, hooks, matcher, meta,
  # native_toolchain_c, objective_c, qr, test_api, vector_math -- were removed
  # so the solver can move: an exact transitive pin holds back every package
  # that depends on it. They are in git if pub asks for one of them back.
  flutter_local_notifications_windows:
    path: local_plugins/flutter_local_notifications_windows

flutter:
  uses-material-design: true
  assets:
    - linux/runner/resources/app_icon.png
