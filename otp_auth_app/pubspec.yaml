name: beatzlock_auth
description: BeatzLock Authenticator - Secure Two-Factor Authentication
version: 1.6.21+36

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  provider: ^6.1.1
  crypto: ^3.0.3
  device_info_plus: ^13.1.0
  mobile_scanner: ^7.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  totp: ^0.1.0
  image_picker: ^1.2.2
  path_provider: ^2.1.2
  http_parser: ^4.0.2
  file_selector_windows: ^0.9.3+5
  local_auth: ^3.0.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.1
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

dependency_overrides:
  firebase_core:
    path: local_plugins/firebase_core
  flutter_local_notifications_windows:
    path: local_plugins/flutter_local_notifications_windows

flutter:
  uses-material-design: true
  assets:
    - linux/runner/resources/app_icon.png
